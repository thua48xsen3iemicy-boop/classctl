<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>classctl</title>
    <link rel="stylesheet" href="/live.css" />
  </head>
  <body>
    <div id="overview">
      <aside id="sidebar" aria-label="Панель аудитории">
        <button id="sidebar-handle" type="button" aria-label="Меню аудитории" aria-controls="sidebar-panel" aria-expanded="false">›</button>
        <div id="sidebar-panel" inert>
          <div class="room">
            <h1>Аудитория <span id="room-name"></span></h1>
            <button id="sidebar-pin" type="button" aria-pressed="false" aria-label="Закрепить панель">Закрепить</button>
          </div>
          <button id="tab" type="button" aria-expanded="false" aria-controls="choices-panel" hidden>Компьютеры</button>
          <section id="choices-panel" hidden>
            <p id="count"></p>
            <label><input id="active-sessions-only" type="checkbox" checked /> Только с графической сессией</label>
            <div id="choices"></div>
          </section>
          <section id="power" aria-label="Питание компьютеров аудитории" hidden>
            <button type="button" data-action="system.shutdown" disabled><span class="power-icon" aria-hidden="true"></span>Выключить все</button>
            <button type="button" data-action="system.reboot" disabled><span class="power-icon" aria-hidden="true"></span>Перезагрузить все</button>
          </section>
        </div>
      </aside>
      <div id="overview-rail">
        <span id="rail-room-name"></span>
        <div id="rail-power" role="group" aria-label="Питание компьютеров аудитории" hidden>
          <button type="button" data-action="system.shutdown" aria-label="Выключить все" title="Выключить все" disabled><span class="power-icon" aria-hidden="true"></span></button>
          <button type="button" data-action="system.reboot" aria-label="Перезагрузить все" title="Перезагрузить все" disabled><span class="power-icon" aria-hidden="true"></span></button>
        </div>
      </div>
      <div id="viewport"><main id="grid" aria-label="Рабочие места"></main></div>
      <div id="power-menu" role="menu" aria-labelledby="power-menu-label" tabindex="-1" hidden>
        <strong id="power-menu-label" role="presentation"></strong>
        <button type="button" role="menuitem" tabindex="-1" data-action="system.shutdown"><span class="power-icon" aria-hidden="true"></span>Выключить</button>
        <button type="button" role="menuitem" tabindex="-1" data-action="system.reboot"><span class="power-icon" aria-hidden="true"></span>Перезагрузить</button>
      </div>
      <p id="power-status" role="status"></p>
    </div>
    <section id="focus" role="dialog" aria-modal="true" aria-labelledby="target" hidden>
      <nav id="tools" aria-label="Панель монитора">
        <button
          id="handle"
          aria-label="Панель монитора"
          aria-controls="drawer"
          aria-expanded="false"
        >
          ›
        </button>
        <div id="drawer" inert>
          <strong id="target"></strong><span id="mode" role="status"></span>
          <button id="swap" type="button" hidden>Другой монитор</button>
          <button id="back">← В аудиторию</button>
        </div>
      </nav>
    </section>
    <p id="notice" role="status">Подключение…</p>
    <script type="module" src="/live.js"></script>
  </body>
</html>
