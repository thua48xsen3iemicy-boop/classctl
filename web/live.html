<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>classctl</title>
    <link rel="stylesheet" href="/live.css" />
  </head>
  <body>
    <div id="overview">
      <header class="toolbar">
        <div class="room">
          <h1>Аудитория</h1>
          <span id="room-name"></span>
        </div>
        <aside class="picker" aria-label="Выбор компьютеров" hidden>
          <button id="tab" type="button" aria-expanded="false" aria-controls="choices-panel">Компьютеры</button>
          <section id="choices-panel" hidden>
            <p id="count"></p>
            <div id="choices"></div>
          </section>
        </aside>
      </header>
      <div id="viewport"><main id="grid" aria-label="Рабочие места"></main></div>
    </div>
    <section id="focus" hidden>
      <nav id="tools" aria-label="Панель монитора">
        <button
          id="handle"
          aria-label="Панель монитора"
          aria-controls="drawer"
          aria-expanded="false"
        >
          ‹
        </button>
        <div id="drawer" inert>
          <strong id="target"></strong><span id="mode" role="status"></span>
          <button id="back">← В аудиторию</button>
        </div>
      </nav>
    </section>
    <p id="notice" role="status">Подключение…</p>
    <script type="module" src="/live.js"></script>
  </body>
</html>
